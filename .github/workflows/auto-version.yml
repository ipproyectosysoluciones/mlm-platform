name: Auto Version

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit -p tsconfig.check.json

      - name: Typecheck frontend
        run: cd frontend && npx tsc -b

      - name: Typecheck bot
        run: cd bot && npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build backend
        run: cd backend && pnpm build

      - name: Build frontend
        run: cd frontend && pnpm build

      - name: Build bot
        run: cd bot && pnpm build

      - name: Unit tests frontend
        run: cd frontend && pnpm test:run

      - name: Unit tests bot
        run: cd bot && pnpm test

  version-bump:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for conventional-changelog

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install conventional-changelog tools
        run: pnpm add -Dw conventional-changelog-cli conventional-recommended-bump

      - name: Detect version bump
        id: bump
        run: |
          BUMP=$(npx conventional-recommended-bump --preset angular 2>/dev/null || echo "")
          echo "type=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Bump type: ${BUMP:-none}"

      - name: Calculate new version
        id: version
        if: steps.bump.outputs.type != ''
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ steps.bump.outputs.type }}" in
            major)   NEW="$((MAJOR + 1)).0.0" ;;
            minor)   NEW="$MAJOR.$((MINOR + 1)).0" ;;
            patch)   NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            *)       echo "Unknown bump type"; exit 1 ;;
          esac

          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW}"

      - name: Check tag does not exist
        id: tag-check
        if: steps.version.outputs.new != ''
        run: |
          TAG="v${{ steps.version.outputs.new }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release branch, tag, PR, and GitHub Release
        if: steps.version.outputs.new != '' && steps.tag-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          CURRENT="${{ steps.version.current }}"
          BRANCH="chore/release-v${NEW_VERSION}"

          echo "=== Bumping ${CURRENT} → ${NEW_VERSION} ==="

          # Configure git identity for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch with version bump
          git checkout -b "$BRANCH"
          npm version "$NEW_VERSION" --no-git-tag-version

          # Generate CHANGELOG
          npx conventional-changelog -p angular -i CHANGELOG.md -s --pkg package.json
          TODAY=$(date +%Y-%m-%d)
          sed -i "s/## \[${NEW_VERSION}\]/## [${NEW_VERSION}] - ${TODAY}/" CHANGELOG.md

          # Commit and push branch
          git add package.json pnpm-lock.yaml CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"
          git push origin "$BRANCH"

          # Create tag and push (manual/3rd-party pushes trigger cd-backend)
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          echo "✅ Tag v${NEW_VERSION} pushed"

          # Create GitHub Release (explicit --latest to avoid draft)
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --generate-notes \
            --latest
          echo "✅ Release v${NEW_VERSION} created"

          # Trigger cd-backend directly (tag pushes from GITHUB_TOKEN don't trigger other workflows)
          gh workflow run cd-backend.yml --ref "v${NEW_VERSION}" --field version="v${NEW_VERSION}"
          echo "✅ cd-backend triggered for v${NEW_VERSION}"

          # Create and auto-merge PR to release
          # The default GITHUB_TOKEN cannot create/approve a PR in a run that
          # was triggered by an Actions-generated push to release
          # ("GitHub Actions is not permitted to create or approve pull requests").
          # Authenticate these two gh calls with a PAT (repo + workflow scopes)
          # stored as `RELEASE_TOKEN`; the step-level GITHUB_TOKEN above still
          # backs git push, gh release create, and gh workflow run (those work).
          PR_URL=$(GH_TOKEN="${{ secrets.RELEASE_TOKEN }}" gh pr create \
            --base release \
            --head "$BRANCH" \
            --title "chore(release): v${NEW_VERSION}" \
            --body "Automated version bump: ${CURRENT} → ${NEW_VERSION}")
          echo "✅ PR created: $PR_URL"

          GH_TOKEN="${{ secrets.RELEASE_TOKEN }}" gh pr merge "$PR_URL" \
            --merge \
            --admin \
            --subject "chore(release): v${NEW_VERSION} [skip ci]"
          echo "✅ PR merged (skip ci)"

      - name: Summary
        if: steps.version.outputs.new != '' && steps.tag-check.outputs.skip != 'true'
        run: |
          echo "## 🏷️ Version Bumped" >> "$GITHUB_STEP_SUMMARY"
          echo "**${{ steps.version.outputs.current }}** → **${{ steps.version.outputs.new }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`v${{ steps.version.outputs.new }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.new }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bump type:** ${{ steps.bump.outputs.type }}" >> "$GITHUB_STEP_SUMMARY"
