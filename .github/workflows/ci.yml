name: CI

on:
  push:
    branches: [development]
    tags-ignore: ['v*']
  pull_request:
    branches: [main, release, development, 'feature/**']
  workflow_dispatch:

# Cancel duplicate runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_NODE24: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  backend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mlm_test
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        run: cd backend && pnpm build

      - name: Type check backend
        run: cd backend && pnpm tsc --noEmit -p tsconfig.check.json

      - name: Unit tests
        run: cd backend && pnpm test
        env:
          DB_DIALECT: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mlm_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TWO_FACTOR_SECRET_KEY: ${{ secrets.CI_TWO_FACTOR_SECRET_KEY }}

      - name: Integration tests (shard ${{ matrix.shard }}/3)
        run: cd backend && SKIP_COMMISSION_CALCULATION=true npx jest --config=jest.integration.config.cjs --runInBand --shard=${{ matrix.shard }}/3
        env:
          DB_DIALECT: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: mlm_test
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TWO_FACTOR_SECRET_KEY: ${{ secrets.CI_TWO_FACTOR_SECRET_KEY }}
          NODE_ENV: test
          VAPID_PUBLIC_KEY: ${{ secrets.CI_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.CI_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.CI_VAPID_SUBJECT }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        if: matrix.shard == 1 && startsWith(github.ref, 'refs/tags/v')
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        run: cd frontend && pnpm test:run

      - name: Build frontend
        run: cd frontend && pnpm build
        env:
          # Enable the cryptoWallet feature flag for CI builds so the Wallet
          # navigation link is present in frontend/dist for Playwright E2E.
          # See issue #347: wallet.spec.ts assumes the link is always visible.
          VITE_FEATURE_CRYPTO_WALLET: "true"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── Playwright E2E tests (mock-based, ~5 min)
  playwright:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    needs: [frontend, changes]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
