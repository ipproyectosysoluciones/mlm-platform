name: CI

on:
  push:
    branches: [main, development]
    tags-ignore: ['v*']
  pull_request:
    branches: [main, development, release]

env:
  FORCE_NODE24: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  backend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mlm_test
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        run: cd backend && pnpm build

      - name: Unit tests
        run: cd backend && pnpm test
        env:
          DB_DIALECT: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mlm_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: ci-test-secret
          TWO_FACTOR_SECRET_KEY: ci-test-2fa-key

      - name: Integration tests (shard ${{ matrix.shard }}/3)
        run: cd backend && SKIP_COMMISSION_CALCULATION=true npx jest --config=jest.integration.config.cjs --runInBand --shard=${{ matrix.shard }}/3
        env:
          DB_DIALECT: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: mlm_test
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
          JWT_SECRET: ci-test-secret
          TWO_FACTOR_SECRET_KEY: ci-test-2fa-key
          NODE_ENV: test
          VAPID_PUBLIC_KEY: BEueSTlTOD2y1tdK7YoKXPdgNqOaVeTYxW0XRSRp6zj0RCJfAAmTUWT4y-7Nlam3FhJdXXFtJSPfQSFi1Y_-O-Y
          VAPID_PRIVATE_KEY: yTkAndYTiEvEvZ4brY98pn1741cHKtdnBIELcRSlr3Y
          VAPID_SUBJECT: mailto:test@mlm-platform.local

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        if: matrix.shard == 1 && (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        run: cd frontend && pnpm test:run

      - name: Build frontend
        run: cd frontend && pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # Playwright E2E tests - ONLY runs on development branch
  # Heavy tests, not suitable for all PRs (cost optimization)
  playwright:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    needs: [frontend, changes]
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Build frontend
        run: cd frontend && pnpm build

      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          VITE_API_URL: http://localhost:3000/api
