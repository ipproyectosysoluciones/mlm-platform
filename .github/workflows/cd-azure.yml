name: CD Azure

on:
  push:
    branches: [development]

# ── Required GitHub Secrets ──────────────────────────────────────────
# AZURE_VM_HOST       — Public IP or hostname of the target VPS
# AZURE_VM_USER       — SSH username (e.g. deploy)
# AZURE_VM_SSH_KEY    — Private SSH key for the VPS
# AZURE_VM_PATH       — Absolute path to project on VPS (e.g. /opt/nexo-real)
# DOCKERHUB_USERNAME  — Docker Hub username
# DOCKERHUB_TOKEN     — Docker Hub access token
# ─────────────────────────────────────────────────────────────────────

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mlm-backend
  BOT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mlm-bot

permissions:
  contents: read
  packages: write

jobs:
  # ── Build Backend ───────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        run: cd backend && pnpm build

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:development
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build Bot ───────────────────────────────────────────────────────
  build-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:development
            ${{ env.BOT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to VPS ───────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-bot]
    environment: azure-development
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.AZURE_VM_PATH }}"
            echo "🚀 Deploying to VPS..."
            echo "   Host: ${{ secrets.AZURE_VM_HOST }}"
            echo "   Path: ${DEPLOY_PATH}"

            cd "${DEPLOY_PATH}"

            echo "📥 Pulling images..."
            docker pull ipproyectos/mlm-backend:development
            docker pull ipproyectos/mlm-bot:development

            echo "🔄 Restarting services..."
            VERSION=development docker compose -f docker-compose.azure.yml --env-file .env.azure up -d --remove-orphans

            echo "⏳ Waiting for services to initialize..."
            sleep 20

      - name: Health check with retry
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.AZURE_VM_PATH }}"
            MAX_RETRIES=5
            RETRY_DELAY=10

            echo "🏥 Running health checks..."

            check_health() {
              local name="$1"
              local url="$2"

              for i in $(seq 1 $MAX_RETRIES); do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "  ✅ ${name}: healthy (HTTP ${HTTP_CODE})"
                  return 0
                fi
                echo "  ⚠️  ${name}: attempt ${i}/${MAX_RETRIES} — HTTP ${HTTP_CODE}, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              done

              echo "  ❌ ${name}: unhealthy after ${MAX_RETRIES} attempts"
              return 1
            }

            HEALTHY=0
            TOTAL=2

            check_health "Backend" "http://localhost:3000/api/health" && HEALTHY=$((HEALTHY + 1)) || true
            check_health "Bot"     "http://localhost:3002/"          && HEALTHY=$((HEALTHY + 1)) || true

            echo ""
            if [ "$HEALTHY" -eq "$TOTAL" ]; then
              echo "🎉 All services healthy (${HEALTHY}/${TOTAL})"
            else
              echo "⚠️  Some services unhealthy (${HEALTHY}/${TOTAL})"
              echo ""
              echo "Debug commands:"
              echo "  cd ${DEPLOY_PATH} && docker compose -f docker-compose.azure.yml logs --tail=50 backend"
              echo "  cd ${DEPLOY_PATH} && docker compose -f docker-compose.azure.yml logs --tail=50 bot"
              echo "  cd ${DEPLOY_PATH} && docker compose -f docker-compose.azure.yml ps"
              exit 1
            fi
