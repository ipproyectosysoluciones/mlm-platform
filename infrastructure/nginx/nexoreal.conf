# =============================================================================
# Nexo Real — Nginx Reverse Proxy
# =============================================================================
# Installed on the VPS by provision.sh, placed at /etc/nginx/sites-available/nexoreal
# Symlinked to /etc/nginx/sites-enabled/nexoreal
#
# SSL termination is handled by Cloudflare tunnel — Nginx listens on port 80 only.
# Usage: sudo ln -sf /etc/nginx/sites-available/nexoreal /etc/nginx/sites-enabled/nexoreal
#        sudo nginx -t && sudo systemctl reload nginx

# --- Rate Limiting Zones ---------------------------------------------------
# Define zones at http level (this file is included in server block,
# but zones must be in http context). Since this is a sites-available file
# included via `include`, we define limits here for clarity.
# NOTE: If your nginx.conf already defines these, remove the duplicate.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bot_limit:10m rate=10r/s;

server {
    listen 80;
    server_name nexoreal.xyz www.nexoreal.xyz;

    # --- Security Headers ---------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Gzip Compression ---------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --- Backend (port 3000) ------------------------------------------------
    # All API traffic → backend container
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Bot (port 3002) — WebSocket + HTTP ----------------------------------
    location /bot/ {
        limit_req zone=bot_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Baileys requires persistent connections)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer timeouts for WebSocket
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --- Health Check Endpoint (Nginx itself) --------------------------------
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # --- Block common attack paths -------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Favicon (avoid 404 noise in logs) -----------------------------------
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
