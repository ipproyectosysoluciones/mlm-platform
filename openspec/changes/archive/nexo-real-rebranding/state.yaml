decisions:
  - id: D1
    title: Unilevel sobre Binario
    rationale: |
      Los servicios inmobiliarios y turísticos tienen ticket alto, ciclos de venta
      largos y comisiones por cierre (no recurrentes). El modelo Binario genera
      desbalance estructural en este contexto. Unilevel es más predecible,
      más justo y más fácil de auditar.

  - id: D2
    title: BuilderBot + Baileys sobre otras soluciones
    rationale: |
      Baileys es la única solución que no requiere WhatsApp Business API paga
      para el MVP. BuilderBot provee la capa de flujos sobre Baileys.
      Para producción multi-tenant se evaluará Meta Cloud API.

  - id: D3
    title: OpenAI GPT-4o como motor AI del bot
    rationale: |
      Capacidad de razonamiento suficiente para manejo de objeciones y
      knowledge base. Costo manejable para demo. Si el volumen crece,
      evaluar GPT-4o-mini o fine-tuning.

  - id: D4
    title: Sophia y Max como agentes diferenciados por género
    rationale: |
      El objetivo es generar mayor empatía y conexión con el usuario.
      Sophia atiende hombres (cálida, carismática), Max atiende mujeres
      (confiable, empático). Detección por nombre o declaración del usuario.

  - id: D5
    title: Bilingüe ES/EN desde el inicio
    rationale: |
      El target es LATAM pero con expansión a mercados anglófonos (turismo
      internacional). La pregunta de idioma al inicio de cada conversación
      garantiza la experiencia correcta desde el primer mensaje.

  - id: D6
    title: prompt_kb/ en .gitignore (nunca al repo)
    rationale: |
      Los prompts y la KB son ventaja competitiva y propiedad intelectual
      del negocio. No deben estar en el repositorio público ni accesibles
      a terceros. Solo el owner y el AI agent tienen acceso.

