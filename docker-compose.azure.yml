# =============================================================================
# Nexo Real — Docker Compose (Azure / VPS)
# =============================================================================
# Usage: docker compose -f docker-compose.azure.yml --env-file .env.azure up -d
#
# This compose file is for VPS deployments (Azure, Hostinger, DonWeb, etc.)
# where PostgreSQL is external (managed service). Includes Redis + n8n.
#
# Memory budget (4GB VM):
#   OS + Docker:   ~700MB
#   PostgreSQL:    ~200MB (Azure managed, not local)
#   Redis:         ~100MB (mem_limit)
#   Backend:       ~500MB (mem_limit)
#   Bot:           ~800MB (mem_limit, Baileys + Chromium)
#   n8n:           ~512MB (mem_limit)
#   Swap:          2GB buffer
#
# Prerequisites:
#   1. provision.sh has been run on the VPS
#   2. .env.azure is configured with real values
#   3. Docker images are pushed to Docker Hub

services:
  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 100m
    networks:
      - mlm-network

  # ── n8n — Workflow Automation ────────────────────────────────────────────
  # Handles: Google Calendar (schedule visits), Notion CRM (leads), human handoff
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # ── Core ──────────────────────────────────────────────────────────
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/}

      # ── Auth — owner account ──────────────────────────────────────────
      N8N_USER_MANAGEMENT_DISABLED: "false"
      N8N_USER_EMAIL: ${N8N_USER_EMAIL}
      N8N_USER_PASSWORD: ${N8N_USER_PASSWORD}
      N8N_USER_FIRST_NAME: ${N8N_USER_FIRST_NAME:-Nexo}
      N8N_USER_LAST_NAME: ${N8N_USER_LAST_NAME:-Admin}

      # ── Timezone ──────────────────────────────────────────────────────
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}

      # ── Persistence (SQLite by default) ───────────────────────────────
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite

      # ── Google Calendar integration ────────────────────────────────────
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}

      # ── Notion integration ─────────────────────────────────────────────
      NOTION_LEADS_DB_ID: ${NOTION_DATABASE_ID_LEADS:-}
      NOTION_DATABASE_ID_VISITS: ${NOTION_DATABASE_ID_VISITS:-}

      # ── Brevo — Human Handoff email ───────────────────────────────────
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_HANDOFF_TEMPLATE_ID: ${BREVO_HANDOFF_TEMPLATE_ID:-1}
      SALES_TEAM_EMAIL: ${SALES_TEAM_EMAIL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    networks:
      - mlm-network

  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    image: ipproyectos/mlm-backend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # ── Core ──────────────────────────────────────────────────────────
      NODE_ENV: production
      PORT: 3000

      # ── Database (External — Azure Managed PostgreSQL) ────────────────
      DB_DIALECT: postgres
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mlm_db}
      DB_USER: ${DB_USER:-mlm_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}

      # ── JWT ───────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # ── 2FA ───────────────────────────────────────────────────────────
      TWO_FACTOR_SECRET_KEY: ${TWO_FACTOR_SECRET_KEY}

      # ── App URLs ──────────────────────────────────────────────────────
      APP_URL: ${APP_URL:-https://nexoreal.xyz}
      FRONTEND_URL: ${FRONTEND_URL:-https://nexoreal.xyz}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://nexoreal.xyz}

      # ── Redis ─────────────────────────────────────────────────────────
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── Email / Brevo ─────────────────────────────────────────────────
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@nexoreal.xyz}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Nexo Real}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SMS_SENDER: ${BREVO_SMS_SENDER:-NexoReal}

      # ── Wallet ────────────────────────────────────────────────────────
      WALLET_MIN_WITHDRAWAL: ${WALLET_MIN_WITHDRAWAL:-20}
      WALLET_FEE_PERCENTAGE: ${WALLET_FEE_PERCENTAGE:-5}
      WALLET_CRON_TIME: ${WALLET_CRON_TIME:-0 0 * * *}

      # ── Push Notifications (VAPID) ────────────────────────────────────
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@nexoreal.xyz}

      # ── PayPal ────────────────────────────────────────────────────────
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}

      # ── MercadoPago ───────────────────────────────────────────────────
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_WEBHOOK_ID: ${MERCADOPAGO_WEBHOOK_ID:-}
      MERCADOPAGO_INTEGRATION_TYPE: ${MERCADOPAGO_INTEGRATION_TYPE:-checkout}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}

      # ── Monitoring ────────────────────────────────────────────────────
      SENTRY_DSN: ${SENTRY_DSN:-}

      # ── Feature flags ─────────────────────────────────────────────────
      SKIP_COMMISSION_CALCULATION: ${SKIP_COMMISSION_CALCULATION:-false}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 500m
    networks:
      - mlm-network

  # ── WhatsApp Bot ────────────────────────────────────────────────────────
  bot:
    image: ipproyectos/mlm-bot:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    # SYS_ADMIN is required by Baileys (chromium/sandboxing)
    cap_add:
      - SYS_ADMIN
    environment:
      NODE_ENV: production
      BOT_PORT: 3002
      PHONE_NUMBER: ${PHONE_NUMBER}
      BOT_SECRET: ${BOT_SECRET}
      MLM_BACKEND_URL: http://backend:3000/api/v1

      # OpenAI — Nexo Bot AI (Sophia + Max)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # Database — External (Azure Managed PostgreSQL)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mlm_db}
      DB_USER: ${DB_USER:-mlm_admin}
      DB_PASSWORD: ${DB_PASSWORD}

      # Platform configuration
      PLATFORM_URL: ${PLATFORM_URL:-https://nexoreal.xyz}
      EMAIL: ${EMAIL:-}
      CALENDLY_LINK: ${CALENDLY_LINK:-}
      OFFICE_ADDRESS: ${OFFICE_ADDRESS:-Ask the agent for more information}

      # n8n — internal webhook base URL
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
    volumes:
      - bot_sessions:/app/bot_sessions
    depends_on:
      backend:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      # Bot doesn't expose a /health endpoint — verify HTTP server is listening
      test: ["CMD-SHELL", "curl -s http://localhost:3002/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 800m
    networks:
      - mlm-network

# --- Volumes ----------------------------------------------------------------
volumes:
  redis_data:
  n8n_data:
  bot_sessions:

# --- Networks ---------------------------------------------------------------
networks:
  mlm-network:
    driver: bridge
