# =============================================================================
# Nexo Real — Docker Compose (Azure / VPS)
# =============================================================================
# Usage: docker compose -f docker-compose.azure.yml --env-file .env.azure up -d
#
# This compose file is for VPS deployments (Azure, Hostinger, DonWeb, etc.)
# where PostgreSQL is external (managed service). No local postgres/redis/n8n.
#
# Prerequisites:
#   1. provision.sh has been run on the VPS
#   2. .env.azure is configured with real values
#   3. Docker images are pushed to Docker Hub

services:
  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    image: ipproyectos/mlm-backend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # ── Core ──────────────────────────────────────────────────────────
      NODE_ENV: production
      PORT: 3000

      # ── Database (External — Azure Managed PostgreSQL) ────────────────
      DB_DIALECT: postgres
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mlm_db}
      DB_USER: ${DB_USER:-mlm_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}

      # ── JWT ───────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # ── 2FA ───────────────────────────────────────────────────────────
      TWO_FACTOR_SECRET_KEY: ${TWO_FACTOR_SECRET_KEY}

      # ── App URLs ──────────────────────────────────────────────────────
      APP_URL: ${APP_URL:-https://nexoreal.xyz}
      FRONTEND_URL: ${FRONTEND_URL:-https://nexoreal.xyz}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://nexoreal.xyz}

      # ── Redis (disabled on Azure — deferred) ──────────────────────────
      REDIS_ENABLED: ${REDIS_ENABLED:-false}

      # ── Email / Brevo ─────────────────────────────────────────────────
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@nexoreal.xyz}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Nexo Real}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SMS_SENDER: ${BREVO_SMS_SENDER:-NexoReal}

      # ── Wallet ────────────────────────────────────────────────────────
      WALLET_MIN_WITHDRAWAL: ${WALLET_MIN_WITHDRAWAL:-20}
      WALLET_FEE_PERCENTAGE: ${WALLET_FEE_PERCENTAGE:-5}
      WALLET_CRON_TIME: ${WALLET_CRON_TIME:-0 0 * * *}

      # ── Push Notifications (VAPID) ────────────────────────────────────
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@nexoreal.xyz}

      # ── PayPal ────────────────────────────────────────────────────────
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}

      # ── MercadoPago ───────────────────────────────────────────────────
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_WEBHOOK_ID: ${MERCADOPAGO_WEBHOOK_ID:-}
      MERCADOPAGO_INTEGRATION_TYPE: ${MERCADOPAGO_INTEGRATION_TYPE:-checkout}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}

      # ── Monitoring ────────────────────────────────────────────────────
      SENTRY_DSN: ${SENTRY_DSN:-}

      # ── Feature flags ─────────────────────────────────────────────────
      SKIP_COMMISSION_CALCULATION: ${SKIP_COMMISSION_CALCULATION:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mlm-network

  # ── WhatsApp Bot ────────────────────────────────────────────────────────
  # NOTE: No n8n dependency — n8n is deferred for Azure deployment.
  # The N8N_WEBHOOK_URL env var is empty or points to an external n8n instance.
  bot:
    image: ipproyectos/mlm-bot:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    # SYS_ADMIN is required by Baileys (chromium/sandboxing)
    cap_add:
      - SYS_ADMIN
    environment:
      NODE_ENV: production
      BOT_PORT: 3002
      PHONE_NUMBER: ${PHONE_NUMBER}
      BOT_SECRET: ${BOT_SECRET}
      MLM_BACKEND_URL: http://backend:3000/api/v1

      # OpenAI — Nexo Bot AI (Sophia + Max)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # Database — External (Azure Managed PostgreSQL)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mlm_db}
      DB_USER: ${DB_USER:-mlm_admin}
      DB_PASSWORD: ${DB_PASSWORD}

      # Platform configuration
      PLATFORM_URL: ${PLATFORM_URL:-https://nexoreal.xyz}
      EMAIL: ${EMAIL:-}
      CALENDLY_LINK: ${CALENDLY_LINK:-}
      OFFICE_ADDRESS: ${OFFICE_ADDRESS:-Ask the agent for more information}

      # n8n — deferred for Azure (no local n8n container)
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - bot_sessions:/app/bot_sessions
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Bot doesn't expose a /health endpoint — verify HTTP server is listening
      test: ["CMD-SHELL", "curl -s http://localhost:3002/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mlm-network

# --- Volumes ----------------------------------------------------------------
# Persist WhatsApp session across container restarts
volumes:
  bot_sessions:

# --- Networks ---------------------------------------------------------------
networks:
  mlm-network:
    driver: bridge
